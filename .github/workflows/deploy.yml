name: Deploy to Production

on:
  push:
    branches:
      - production
      - main
  workflow_dispatch:
    inputs:
      db_strategy:
        description: 'Database handling strategy'
        required: true
        default: 'migrate'
        type: choice
        options:
          - 'migrate'
          - 'db_push'
          - 'reset_and_seed'
          - 'none'
      confirm_reset:
        description: 'Type RESET_CONFIRM to confirm database reset (only needed for reset_and_seed)'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rsync & sshpass
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Sync source files to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          TARGET="/www/wwwroot/www.dromkok.com/web"
          PORT="${SERVER_PORT:-22}"

          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 15
            ServerAliveCountMax 4
            TCPKeepAlive yes
            ConnectTimeout 15
          EOF
          chmod 600 ~/.ssh/config

          # Sync source files to server with retry logic
          SUCCESS=0
          for attempt in 1 2 3 4; do
            echo "🔄 Sync attempt $attempt..."
            if sshpass -p "$SERVER_PASSWORD" rsync -az --delete \
              --exclude='.git' \
              --exclude='node_modules' \
              --exclude='.next' \
              --exclude='.env*' \
              -e "ssh -p $PORT -o ConnectTimeout=15 -o ServerAliveInterval=15" \
              ecommerce-monorepo/web/ ${SERVER_USER}@${SERVER_HOST}:${TARGET}/; then
              echo "✅ Files synced successfully."
              SUCCESS=1
              break
            else
              echo "⚠️ Sync attempt $attempt failed. Waiting 5 seconds before retrying..."
              sleep 5
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ All sync attempts failed."
            exit 1
          fi

      - name: Build, restore catalog and restart on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          TARGET="/www/wwwroot/www.dromkok.com/web"
          PORT="${SERVER_PORT:-22}"

          echo "🚀 Executing build, migrations, catalog restore & restart on remote server..."

          SUCCESS=0
          for attempt in 1 2 3 4 5; do
            echo "🔄 Remote execution attempt $attempt..."
            if sshpass -p "$SERVER_PASSWORD" ssh -p $PORT \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              ${SERVER_USER}@${SERVER_HOST} "bash -s" << 'REMOTECOMMANDS'
                set -e
                TARGET="/www/wwwroot/www.dromkok.com/web"
                cd "$TARGET"

                echo "📦 Installing / verifying dependencies on server..."
                export npm_config_cache="/tmp/.npm-cache"
                mkdir -p /tmp/.npm-cache
                npm install --legacy-peer-deps --no-audit --no-fund --prefer-offline --cache /tmp/.npm-cache

                echo "🔧 Generating Prisma client..."
                npx prisma generate

                echo "🗄️ Synchronizing complete schema with PostgreSQL via prisma db push..."
                npx prisma db push --skip-generate --accept-data-loss || true

                echo "🛡️ Verifying critical columns..."
                node -e "
                  const { PrismaClient } = require('@prisma/client');
                  const p = new PrismaClient();
                  Promise.all([
                    p.\$executeRawUnsafe('ALTER TABLE \"carts\" ADD COLUMN IF NOT EXISTS \"mode\" TEXT NOT NULL DEFAULT \'RETAIL\''),
                    p.\$executeRawUnsafe('ALTER TABLE \"cart_items\" ADD COLUMN IF NOT EXISTS \"mode\" TEXT NOT NULL DEFAULT \'RETAIL\''),
                    p.\$executeRawUnsafe('ALTER TABLE \"cart_items\" ADD COLUMN IF NOT EXISTS \"selectedOptions\" JSONB'),
                    p.\$executeRawUnsafe('ALTER TABLE \"order_items\" ADD COLUMN IF NOT EXISTS \"selectedOptions\" JSONB'),
                    p.\$executeRawUnsafe('ALTER TABLE \"system_settings\" ADD COLUMN IF NOT EXISTS \"openrouterApiKey\" TEXT'),
                    p.\$executeRawUnsafe('ALTER TABLE \"system_settings\" ADD COLUMN IF NOT EXISTS \"geminiApiKey\" TEXT'),
                    p.\$executeRawUnsafe('ALTER TABLE \"system_settings\" ADD COLUMN IF NOT EXISTS \"primaryAiProvider\" TEXT DEFAULT \'openai\''),
                    p.\$executeRawUnsafe('ALTER TABLE \"system_settings\" ADD COLUMN IF NOT EXISTS \"storeMode\" TEXT DEFAULT \'WHOLESALE\''),
                  ]).then(() => { console.log('✅ Critical database columns verified successfully.'); process.exit(0); })
                    .catch(e => { console.warn('Schema patch notice:', e.message); process.exit(0); });
                " || true

                echo "📦 Restoring complete product catalog snapshot (6,743 products & 122 categories)..."
                node scripts/restore-catalog-snapshot.js --force || true

                echo "🏗️ Building Next.js application..."
                rm -rf .next
                npm run build

                echo "🔄 Restarting PM2 process..."
                pm2 restart all || pm2 start npm --name "dromkok-web" -- run start
                pm2 save

                echo "⏳ Health check..."
                sleep 5
                curl -f -s http://localhost:3001/api/health > /dev/null && echo "✅ App healthy" || echo "⚠️ App starting..."

                echo "✅ Deployment & Catalog Migration Complete!"
REMOTECOMMANDS
            then
              echo "✅ Build and restart completed successfully!"
              SUCCESS=1
              break
            else
              echo "⚠️ Attempt $attempt failed. Waiting 8 seconds before retrying..."
              sleep 8
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ All remote execution attempts failed."
            exit 1
          fi