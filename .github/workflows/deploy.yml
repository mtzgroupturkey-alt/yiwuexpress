name: Deploy to Production

on:
  push:
    branches:
      - production
      - main
  workflow_dispatch:
    inputs:
      db_strategy:
        description: 'Database handling strategy'
        required: true
        default: 'migrate'
        type: choice
        options:
          - 'migrate'
          - 'db_push'
          - 'reset_and_seed'
          - 'none'
      confirm_reset:
        description: 'Type RESET_CONFIRM to confirm database reset (only needed for reset_and_seed)'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rsync & sshpass
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Sync source files to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          TARGET="/www/wwwroot/www.dromkok.com/web"
          PORT="${SERVER_PORT:-22}"

          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 15
            ServerAliveCountMax 4
            TCPKeepAlive yes
            ConnectTimeout 15
          EOF
          chmod 600 ~/.ssh/config

          # Sync source files to server with retry logic
          SUCCESS=0
          for attempt in 1 2 3 4; do
            echo "🔄 Sync attempt $attempt..."
            if sshpass -p "$SERVER_PASSWORD" rsync -az --delete \
              --exclude='.git' \
              --exclude='node_modules' \
              --exclude='.next' \
              --exclude='.env*' \
              -e "ssh -p $PORT -o ConnectTimeout=15 -o ServerAliveInterval=15" \
              ecommerce-monorepo/web/ ${SERVER_USER}@${SERVER_HOST}:${TARGET}/; then
              echo "✅ Files synced successfully."
              SUCCESS=1
              break
            else
              echo "⚠️ Sync attempt $attempt failed. Waiting 5 seconds before retrying..."
              sleep 5
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ All sync attempts failed."
            exit 1
          fi

      - name: Build and restart on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_STRATEGY: ${{ inputs.db_strategy || 'migrate' }}
          CONFIRM_RESET: ${{ inputs.confirm_reset || '' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: false
          envs: DATABASE_URL,DB_STRATEGY,CONFIRM_RESET
          script: |
            set -e
            TARGET="/www/wwwroot/www.dromkok.com/web"
            cd "$TARGET"

            echo "📦 Installing dependencies on server..."
            export npm_config_cache="/tmp/.npm-cache"
            mkdir -p /tmp/.npm-cache
            npm install --legacy-peer-deps --no-audit --no-fund --prefer-offline --cache /tmp/.npm-cache

            echo "🔧 Generating Prisma client..."
            npx prisma generate

            echo "📊 Strategy: '${DB_STRATEGY}', Confirm: '${CONFIRM_RESET}'"

            # Normalize values
            RAW_STRATEGY="${DB_STRATEGY:-migrate}"
            RAW_CONFIRM="${CONFIRM_RESET:-}"
            STRATEGY=$(echo "$RAW_STRATEGY" | tr -d '[:space:]')
            CONFIRM=$(echo "$RAW_CONFIRM" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')

            if [ "$STRATEGY" = "reset_and_seed" ]; then
              if [ "$CONFIRM" = "RESET_CONFIRM" ] || [ "$CONFIRM" = "RESET" ]; then
                echo "⚠️ OPTION C: Resetting production database and running seeds..."
                if [ -f "prisma/migrations/backup.sh" ]; then
                  echo "📦 Creating pre-wipe backup..."
                  bash prisma/migrations/backup.sh "pre_reset_$(date +%Y%m%d_%H%M%S)" || true
                fi
                npx prisma migrate reset --force --skip-generate
                echo "🔧 Synchronizing schema with database..."
                npx prisma db push --skip-generate --accept-data-loss
                npm run db:seed
                echo "🌱 Seeding categories, admin, and initial products/sample data..."
                npm run db:seed:sample
                echo "🌱 Seeding comprehensive product catalog and attributes..."
                npm run db:seed:products || true
                echo "✅ Database reset and seeded with full product catalog successfully!"
              else
                echo "❌ Database reset was requested but confirmation phrase was '${CONFIRM_RESET}' (expected: RESET_CONFIRM). Aborting to protect data."
                exit 1
              fi
            elif [ "$STRATEGY" = "db_push" ]; then
              echo "🔧 Synchronizing database schema via prisma db push..."
              npx prisma db push --skip-generate --accept-data-loss
              echo "✅ Database schema synchronized successfully via db push!"
            elif [ "$STRATEGY" = "none" ]; then
              echo "⏭️ Skipping database migrations/changes as requested by db_strategy=none."
            else
              echo "🗄️ Resolving any previously failed migrations..."
              set +e
              npx prisma migrate resolve --rolled-back 20260918000000_add_rfq_system 2>/dev/null
              RESOLVE_EXIT=$?
              set -e
              if [ $RESOLVE_EXIT -eq 0 ]; then
                echo "↩️  Resolved failed migration: 20260918000000_add_rfq_system"
              else
                echo "ℹ️  No failed migration to resolve (already clean)."
              fi

              echo "🗄️ Applying pending database migrations..."
              set +e
              npx prisma migrate deploy
              MIGRATE_EXIT=$?
              set -e
              if [ $MIGRATE_EXIT -ne 0 ]; then
                echo "⚠️ prisma migrate deploy exited with status $MIGRATE_EXIT. Falling back to prisma db push to synchronize schema..."
                npx prisma db push --skip-generate --accept-data-loss
                echo "✅ Schema synchronized via fallback db push."
              else
                echo "✅ Database migrations applied successfully."
              fi
            fi

            echo "🏗️ Building Next.js application..."
            rm -rf .next
            npm run build

            echo "🔄 Restarting PM2 process..."
            pm2 restart all || pm2 start npm --name "dromkok-web" -- run start
            pm2 save

            echo "⏳ Health check..."
            sleep 5
            curl -f -s http://localhost:3001/api/health > /dev/null && echo "✅ App healthy" || echo "⚠️ App starting..."

            echo "✅ Deployment complete!"