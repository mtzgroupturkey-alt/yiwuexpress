name: Deploy to Production

on:
  push:
    branches:
      - production
      - main
  workflow_dispatch:
    inputs:
      db_strategy:
        description: 'Database handling strategy'
        required: true
        default: 'migrate'
        type: choice
        options:
          - 'migrate'
          - 'db_push'
          - 'reset_and_seed'
          - 'none'
      confirm_reset:
        description: 'Type RESET_CONFIRM to confirm database reset (only needed for reset_and_seed)'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rsync & sshpass
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Sync source files to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          TARGET="/www/wwwroot/www.dromkok.com/web"
          PORT="${SERVER_PORT:-22}"

          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 10
            TCPKeepAlive yes
            ConnectTimeout 30
            IPQoS throughput
            ControlMaster auto
            ControlPath ~/.ssh/control-%C
            ControlPersist 120s
          EOF
          chmod 600 ~/.ssh/config

          # Sync source files to server with progressive backoff and retry logic
          SUCCESS=0
          for attempt in 1 2 3 4 5 6; do
            echo "🔄 Sync attempt $attempt..."
            if sshpass -p "$SERVER_PASSWORD" rsync -az --delete \
              --exclude='.git' \
              --exclude='node_modules' \
              --exclude='.next' \
              --exclude='.env*' \
              --exclude='public/uploads' \
              -e "ssh -p $PORT -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o IPQoS=throughput" \
              ecommerce-monorepo/web/ ${SERVER_USER}@${SERVER_HOST}:${TARGET}/; then
              echo "✅ Files synced successfully."
              SUCCESS=1
              break
            else
              WAIT_SEC=$((attempt * 8))
              echo "⚠️ Sync attempt $attempt failed. Waiting ${WAIT_SEC} seconds before retrying..."
              sleep $WAIT_SEC
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ All sync attempts failed."
            exit 1
          fi

      - name: Build, restore catalog and restart on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          PORT="${SERVER_PORT:-22}"

          echo "🚀 Executing build, migrations, catalog restore & restart on remote server..."

          SUCCESS=0
          for attempt in 1 2 3 4 5; do
            echo "🔄 Remote execution attempt $attempt..."
            if sshpass -p "$SERVER_PASSWORD" ssh -p $PORT \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              ${SERVER_USER}@${SERVER_HOST} "bash /www/wwwroot/www.dromkok.com/web/scripts/deploy-production.sh"; then
              echo "✅ Build, catalog restore and PM2 restart completed successfully!"
              SUCCESS=1
              break
            else
              echo "⚠️ Remote attempt $attempt failed. Waiting 8 seconds before retrying..."
              sleep 8
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ All remote execution attempts failed."
            exit 1
          fi